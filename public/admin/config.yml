# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: nineanswerer/nineanswerer.github.io
  branch: main

site_url: https://nineanswerer.github.io
display_url: https://nineanswerer.github.io
media_folder: /public/images
public_folder: /images

output:
  omit_empty_optional_fields: true

collections:
  - name: writing
    label: 长文
    label_singular: 长文
    folder: /src/content/writing
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: descending }
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 简介, name: description, widget: text, hint: 用于列表、搜索结果和页面摘要。 }
      - { label: 发布日期, name: date, widget: datetime, type: date, format: YYYY-MM-DD, default: '{{now}}' }
      - { label: 更新日期, name: updated, widget: datetime, type: date, format: YYYY-MM-DD, required: false, hint: 需要记录内容修订时填写；留空不会写入文章。 }
      - { label: 关联项目, name: project, widget: string, required: false, hint: 例如 storagescope；没有关联项目时留空。 }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 仅保存为草稿, name: draft, widget: boolean, default: true, required: false, hint: 开启时不会公开；确认发布时关闭此开关并保存。修改已发布内容后，保存会更新公开页面。 }
      - { label: 正文, name: body, widget: richtext }

  - name: notes
    label: 碎片
    label_singular: 碎片
    folder: /src/content/notes
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: descending }
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 简介, name: description, widget: text, hint: 用于列表、搜索结果和页面摘要。 }
      - { label: 发布日期, name: date, widget: datetime, type: date, format: YYYY-MM-DD, default: '{{now}}' }
      - { label: 更新日期, name: updated, widget: datetime, type: date, format: YYYY-MM-DD, required: false, hint: 需要记录内容修订时填写；留空不会写入文章。 }
      - { label: 关联项目, name: project, widget: string, required: false, hint: 例如 storagescope；没有关联项目时留空。 }
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 仅保存为草稿, name: draft, widget: boolean, default: true, required: false, hint: 开启时不会公开；确认发布时关闭此开关并保存。修改已发布内容后，保存会更新公开页面。 }
      - { label: 正文, name: body, widget: richtext }

  - name: projects
    label: 项目
    label_singular: 项目
    folder: /src/content/projects
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields:
      fields: [order, date, title]
      default: { field: order, direction: ascending }
    fields:
      - { label: 项目名称, name: title, widget: string }
      - { label: 一句话说明, name: tagline, widget: string }
      - { label: 项目简介, name: description, widget: text }
      - { label: 开始日期, name: date, widget: datetime, type: date, format: YYYY-MM-DD, default: '{{now}}' }
      - { label: 更新日期, name: updated, widget: datetime, type: date, format: YYYY-MM-DD, required: false, hint: 需要记录内容修订时填写；留空不会写入文章。 }
      - { label: 首页重点项目, name: featured, widget: boolean, default: false, required: false, hint: 多项开启时优先展示排序数字最小的项目。 }
      - { label: 仅保存为草稿, name: draft, widget: boolean, default: true, required: false, hint: 草稿不会出现在首页、项目架、搜索和详情页面。 }
      - label: 视觉呈现（可选）
        name: presentation
        widget: object
        required: false
        fields:
          - { label: 卡片类型, name: kind, widget: select, options: [generic, translation, extraction, flow], default: generic }
          - { label: 小标题, name: eyebrow, widget: string, required: false }
          - { label: 首页短说明, name: caption, widget: string, required: false }
          - { label: 重点标题分行, name: titleLines, widget: list, required: false, hint: 最多三行；留空使用项目名称。 }
          - label: 展示图片
            name: cover
            widget: object
            required: false
            fields:
              - { label: 图片, name: src, widget: image, required: true }
              - { label: 替代文字, name: alt, widget: string }
              - { label: 原图宽度, name: width, widget: number, value_type: int, min: 1 }
              - { label: 原图高度, name: height, widget: number, value_type: int, min: 1 }
              - { label: 图片说明, name: note, widget: string, required: false }
      - { label: 验证范围说明, name: evidenceNote, widget: text, required: false }
      - { label: 当前状态, name: status, widget: string }
      - { label: 我的职责, name: role, widget: string }
      - { label: 技术栈, name: stack, widget: list }
      - { label: 源码地址, name: repo, widget: string, hint: 填写完整的 https:// 地址。 }
      - { label: 发布地址, name: release, widget: string, required: false, hint: 填写完整的 https:// 地址；没有发布地址可留空。 }
      - { label: 排序, name: order, widget: number, value_type: int, default: 10, hint: 数字越小，项目列表中的位置越靠前。 }
      - { label: 贡献说明, name: contribution, widget: text, required: false, hint: 直接说明你和协作者分别完成了什么。 }
      - label: 验证数字
        name: metrics
        widget: list
        required: false
        hint: 只填写已有证据的数字，并说明统计口径。
        fields:
          - { label: 数字, name: value, widget: string }
          - { label: 口径说明, name: label, widget: string }
      - label: 更新记录
        name: updates
        widget: list
        required: false
        fields:
          - { label: 日期, name: date, widget: datetime, type: date, format: YYYY-MM-DD, default: '{{now}}' }
          - { label: 标题, name: title, widget: string }
          - { label: 说明, name: description, widget: text }
      - { label: 正文, name: body, widget: richtext }

  - name: pages
    label: 单页内容
    files:
      - name: home
        label: 首页内容与视觉开关
        file: /src/content/home/index.json
        fields:
          - { label: 实验期号, name: edition, widget: string }
          - { label: 首页标题（两行）, name: heading, widget: list, min: 2, max: 2 }
          - { label: 自我介绍, name: intro, widget: text }
          - { label: 最近状态, name: status, widget: string }
          - { label: 首页项目数上限, name: projectsLimit, widget: number, value_type: int, min: 1, max: 12, default: 6 }
          - label: 交互雕塑
            name: visual
            widget: object
            fields:
              - { label: 启用交互, name: enabled, widget: boolean, default: true, hint: 关闭后显示静态构成，内容仍然完整可用。 }
              - { label: 默认自动旋转, name: autoplay, widget: boolean, default: true, hint: 浏览者的减少动态效果设置优先。 }
          - label: 关于我
            name: about
            widget: object
            fields:
              - { label: 标题（两行）, name: heading, widget: list, min: 2, max: 2 }
              - { label: 简介, name: text, widget: text }
              - { label: 协作说明, name: collaboration, widget: text }
      - name: now
        label: 现在页
        file: /src/content/now/current.md
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 页面简介, name: description, widget: text }
          - { label: 更新日期, name: updated, widget: datetime, type: date, format: YYYY-MM-DD, default: '{{now}}' }
          - { label: 正文, name: body, widget: richtext }
