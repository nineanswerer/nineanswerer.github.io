<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-labelledby="title desc">
  <title id="title">目录分支聚焦原理示意</title>
  <desc id="desc">在同一示例中进入 B 分支，保留根到 B 的路径，突出 B 的两个子目录；其他分支仍保留在数据中。</desc>
  <rect width="320" height="230" fill="#fffdf7"/>
  <g fill="none" stroke-width="1.5"><path d="M160 54v43" stroke="#355e9e"/><path d="M160 120v17m0 0-65 27m65-27 65 27" stroke="#355e9e"/><path d="M160 66 45 103m115-37 115 37" stroke="#c1cbd9" stroke-dasharray="4 4"/></g>
  <g stroke-width="1.5"><rect x="137" y="30" width="46" height="25" rx="2" fill="#f5f0e6" stroke="#355e9e"/><rect x="134" y="96" width="52" height="27" rx="2" fill="#f9e9df" stroke="#b94030"/><rect x="72" y="160" width="46" height="25" rx="2" fill="#f5f0e6" stroke="#355e9e"/><rect x="202" y="160" width="46" height="25" rx="2" fill="#f5f0e6" stroke="#355e9e"/></g>
  <g fill="#25231f" font-family="sans-serif" font-size="14" text-anchor="middle"><text x="160" y="48">根</text><text x="160" y="115">B</text><text x="95" y="178">B-1</text><text x="225" y="178">B-2</text><g fill="#706a60"><text x="40" y="119">A</text><text x="280" y="119">C</text></g></g>
  <text x="160" y="213" fill="#706a60" font-family="sans-serif" font-size="13" text-anchor="middle">示例结构 · 非应用截图</text>
</svg>
